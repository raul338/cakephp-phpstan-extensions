name: CI

on:
  push:
    branches:
      - master
      - '1.x'
      - '2.x'
      - '3.x'
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'

    - name: Get Composer Cache Directory
      id: composer-cache
      run: |
        echo "CI_COMPOSER_CACHE_DIR=$(composer config cache-files-dir)" >> $GITHUB_STATE

    - name: Get date part for cache key
      id: key-date
      run: echo "CI_COMPOSER_CACHE_DATE=$(date +'%Y-%m')" >> $GITHUB_STATE

    - uses: actions/cache@v4
      with:
        path: $CI_COMPOSER_CACHE_DIR
        key: ${{ runner.os }}-composer-${CI_COMPOSER_CACHE_DATE}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Code Style Check
      run: vendor/bin/phpcs

    - name: phpstan
      run: vendor/bin/phpstan analyze -c phpstan.neon --no-progress

    - name: phpunit
      run: vendor/bin/phpunit --testdox
